        IDs are unique across the system, so this may be modified by the system to ensure uniqueness.


        If you do not specify any affiliate_id, we will generate one based on the user''s name or email
        address.


        If the user already exists in the system and has an affiliate ID set already, your parameter will
        be ignored and their affiliate ID will not be modified.'
