- id: iso27001
  name: ISO/IEC 27001
  claimed: false
- id: hipaa
  name: HIPAA
  claimed: false
regulatory_context:
  us_self_cancellation: >-
    The April 2026 release notes reference U.S. self-cancellation rights, consistent with the FTC
    negative-option / click-to-cancel expectations for recurring billing. The API exposes
    POST /cancelSubscription, so the capability is programmatically reachable.
