note: >-
  ThriveCart does not publish a conventional /pricing page - https://thrivecart.com/pricing and
  /pricing/ both redirect to https://thrivecart.com/signin/. The plan comparison lives on the
  Pro+ product page, and the actual dollar figures are only rendered on ThriveCart's own hosted
  checkouts (ThriveCart sells itself through ThriveCart). Prices below were read from those
  checkouts on 2026-08-12. The API is not metered or priced separately: there is no API plan, no
  per-call charge and no published API quota beyond the flat 60 requests/minute that every
  account shares. Payment-processing fees are charged by the connected processor (Stripe, PayPal,
  Authorize.net), not by ThriveCart, and are documented separately at
  https://thrivecart.com/company/processorfees/.
