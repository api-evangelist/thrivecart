versioning:
  scheme: unversioned path
  current_version: '1'
  path: /api/external
  header: null
  query_param: null
  pinning_possible: false
  evidence: >-
    The base path carries no version segment. The official PHP SDK declares
    const API_VERSION = '1.0.0' and Packagist describes it as "PHP library for v1 of the
    ThriveCart API". No mechanism exists for a client to request a specific version, so any
    change ThriveCart makes reaches every caller at once.
deprecation:
  policy_published: false
  policy_url: null
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: >-
    ThriveCart publishes no deprecation or sunset policy, sends no Deprecation or Sunset headers,
    and marks no operation deprecated in its reference. The documentation does carry two
    forward-looking "Coming soon!" entries (Create & manage coupons, Embed the customer hub),
    which is the only lifecycle signalling on the developer portal - additions announced, removals
    not.
sla:
  published: false
  uptime_target: null
  note: No SLA or uptime commitment is published for Standard or Pro+. The Enterprise tier is
    "contact us" and any commitment there is contractual, not public.
