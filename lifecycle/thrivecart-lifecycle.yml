gaps:
- No deprecation policy and no Sunset/Deprecation headers (RFC 8594).
- No version pinning of any kind, so a breaking change has no opt-out.
- No published SLA.
- The changelog is a blog category rather than a developer-scoped API changelog; API changes are
  mixed in with marketing posts and must be filtered by reading each entry.
