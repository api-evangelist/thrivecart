apis:
- aid: thrivecart-api
  name: ThriveCart API
  description: 'REST API for a ThriveCart account. Reads products, bump offers, upsells,
    downsells and their pricing options; searches transactions and affiliates; reads customer
    records; refunds transactions; cancels, pauses and resumes subscriptions; creates and
    manages affiliates and their commissions; creates Learn students; and creates or removes
    targeted event subscriptions. Authenticated with an account API key or an OAuth 2.0
    access token sent as a bearer token. Rate limited to 60 requests per minute per connected
    account.'
  humanURL: https://developers.thrivecart.com/documentation/
