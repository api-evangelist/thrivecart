aid: thrivecart
name: ThriveCart
description: 'ThriveCart is a hosted shopping cart, checkout and course platform for creators,
  coaches and digital-product sellers, operated by ThriveCart LLC. It sells one-time and
  recurring digital and physical products through customisable checkout pages with order
  bumps, one-click upsells and downsells, A/B testing, abandoned-cart recovery, sales-tax
  automation and a built-in affiliate centre, and bundles a learning-management product
  (ThriveCart Learn / ThriveCart Academy). Payments are processed through Stripe, PayPal,
  Authorize.net and ThrivePay Installments rather than by ThriveCart itself. The public
  ThriveCart API is a bearer-token REST surface at https://thrivecart.com/api/external
  covering products, bump offers, upsells, downsells, pricing options, transactions,
  customers, subscriptions, affiliates, Learn students and event subscriptions, with an
  account-wide webhook surface and a targeted Event Subscription API alongside it.'
