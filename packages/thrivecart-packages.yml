summary: >-
  ThriveCart ships exactly one first-party client library: a PHP SDK on Packagist. Its most recent
  release is 1.0.11, published 2022-01-19 - over four years stale as of this pass, while the API
  itself has continued to gain fields (the April 2026 release added customer.id and
  subscription_current_status to Search Transactions). The docs still recommend it as the primary
  integration path and explicitly invite community SDKs for other languages: "We welcome any
  community submissions for other SDKs!". No official JavaScript, Python, Go, Ruby, Rust, Java or
  .NET client exists.
