tools_an_agent_needs_that_no_operation_serves:
- need: read an order by id
  reason: >-
    order_id is the required key for refundATransaction, cancelASubscription, pauseASubscription
    and resumeASubscription, but no operation returns an order. An agent must reach it through
    searchTransactions or a webhook payload.
- need: list or read subscriptions
  reason: >-
    subscription_id is required by three write operations and returned by none. There is no way
    to enumerate an account's subscriptions through the API.
- need: list event subscriptions
  reason: >-
    POST /subscribe and POST /unsubscribe create and remove subscriptions keyed by target_url,
    but nothing lists them. An agent cannot discover what it previously subscribed, and cannot
    reconcile after losing state.
- need: read, update or delete a Learn student
  reason: createNewStudent is write-only; there is no read side to the Learn surface.
- need: list courses
  reason: course_id is required by createNewStudent but no operation enumerates courses.
- need: create, update or delete a product / bump / upsell / downsell
  reason: >-
    The entire catalog is read-only through the API. An agent can price and report on offers but
    cannot build or edit them.
- need: coupons
  reason: '"Create & manage coupons" is listed on developers.thrivecart.com as "Coming soon!".'
