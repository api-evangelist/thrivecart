summary: >-
  ThriveCart operates no first-party Model Context Protocol server. Probes on 2026-08-12 found no
  /.well-known/mcp.json, no MCP endpoint on thrivecart.com or developers.thrivecart.com, and no
  mention of MCP anywhere on developers.thrivecart.com or in the API reference. Every ThriveCart
  "MCP server" currently discoverable is a third-party gateway wrapping the REST API - Zapier MCP,
  Pipedream MCP, viaSocket, mcpforclaude - none of them ThriveCart-operated. The tool set below is
  DERIVED by API Evangelist from the 33 operations of the ThriveCart API as a proposal for an
  agent-facing surface. It is not published by ThriveCart.
server: null
transport: null
url: null
auth:
  type: http
  scheme: bearer
  note: >-
    Any MCP server over this API would inherit ThriveCart's single account-wide bearer token. There
    is no scope model, so an MCP server cannot be granted read-only access - a token that can list
    products can also issue refunds and cancel subscriptions. That is the central design problem
    for an agent surface here, and it is ThriveCart's to fix.
