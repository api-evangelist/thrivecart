notes:
- >-
  Nine of the 33 candidate tools are consequential writes (refund, cancel, pause, resume, custom
  commissions, delete affiliate, create student, subscribe, unsubscribe) and the API offers no
  idempotency key on any of them, so an MCP client that retries after a timeout can double-refund.
  Any real server built on this should carry its own idempotency layer.
- >-
  Because test and live share one credential (see sandbox/thrivecart-sandbox.yml), an MCP server
  cannot be pointed at a safe environment for evaluation.
