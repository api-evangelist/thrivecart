    messages:
      cartAbandoned:
        name: cart_abandoned
        title: Cart abandoned
        summary: A customer entered their email address on the cart page but left without
          purchasing.
        traits: [$ref: '#/components/messageTraits/thrivecartEvent']
    x-trigger-fields:
    - name: base_product
      required: false
      type: numeric or array
  affiliate_approved:
    address: affiliate_approved
    messages:
      affiliateApproved:
