  and to webhook payloads - are announced in the "Product Updates" category of the marketing blog,
  interleaved with feature launches and course-platform news. There is a dated RSS feed, which is
  machine-readable, but nothing distinguishes an API-affecting entry from a UI-only one without
  reading the post. Entries below are the recent window from that feed, read on 2026-08-12;
  api_relevant is API Evangelist's classification, not ThriveCart's.
